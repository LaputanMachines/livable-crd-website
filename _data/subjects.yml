# Questionnaire topics, in the order every list of them is drawn: the scorecard
# matrix's columns, the rows on a candidate's page and their print leaflet, and
# the subjects written into _data/scores.yml by scripts/sync-questionnaire.py,
# which sorts by this file.
#
# General and Healthcare access lead, and are the two nobody grades: no letter is
# coming for either and both carry answers worth reading instead. Keeping them
# adjacent means the reader meets that pair once, rather than meeting General,
# working down seven graded topics, and hitting a second unlettered row near the
# bottom that looks like a topic somebody forgot to score. The seven graded
# topics follow in the coalition form's own order.
#
# `short` is the compact label used in scorecard table column headers.
# `abbr` is an optional even-shorter label swapped in on narrower screens, for
# topics whose `short` would otherwise stretch its column. Full name is always
# available via the header tooltip and to screen readers.
- id: general
  name: General
  short: General
  icon: general.svg
  accent: "#5b5169"
  description: >-
    Cross-cutting questions that apply across topics or address overall vision for
    livability in the Capital Region.

- id: healthcare-access
  name: Healthcare access
  short: Health
  icon: healthcare-access.svg
  accent: "#be185d"
  description: >-
    Access to clinics, mental health supports, and municipal actions that help
    residents get timely care close to home.

- id: transit
  name: Transit
  short: Transit
  icon: transit.svg
  accent: "#3730a3"
  description: >-
    Public transit service, funding, and integration so more people can get around
    without driving for every trip.

- id: housing
  name: Housing
  short: Housing
  icon: housing.svg
  accent: "#5c18a4"
  description: >-
    Affordable and diverse homes, gentle density, tenant protections, and land-use
    choices that help people of all incomes live here.

- id: climate
  name: Climate
  short: Climate
  icon: climate.svg
  accent: "#7e22ce"
  description: >-
    Climate action, emissions reduction, resilience, and aligning growth with a
    sustainable future.

- id: arts
  name: Arts
  short: Arts
  icon: arts.svg
  accent: "#a21caf"
  description: >-
    Creative spaces, cultural programming, and municipal support for arts and
    culture in everyday community life.

- id: rolling-cycling
  name: Rolling & cycling
  short: Cycling
  icon: rolling-cycling.svg
  accent: "#4f46e5"
  description: >-
    Safe bike lanes, rolling infrastructure, and policies that make cycling and
    wheeled mobility practical for more residents.

- id: walking
  name: Walking
  short: Walking
  icon: walking.svg
  accent: "#9333ea"
  description: >-
    Walkable neighbourhoods, sidewalks, crossings, and street design that put
    people first on foot.

- id: governance
  name: Governance
  short: Governance
  abbr: Gov
  icon: governance.svg
  accent: "#831843"
  description: >-
    Open and accountable local government: transparent decision-making,
    meaningful public consultation, and council processes residents can follow
    and trust.
