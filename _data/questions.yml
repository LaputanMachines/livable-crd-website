    type: text
    type_label: Written answer
    graded: false
  # --- housing ---
  - label: HFL-01
    subject: housing
    question: >-
      What kinds of housing could your municipality use more of? Select all
      that apply.
    type: multi
    graded: true
    owner: Homes for Living
    methodology: >-
      1 point per selected type to max of 8. Housing exists on a continuum and
      different types are appropriate for different households. All housing is
      needed and positively affects other types via vacancy chains
    options:
      - Supportive housing for those who need mental health and substance use support.
      - Publicly funded accessible housing for elderly and/or disabled people.
      - Non-market affordable housing.
      - Small homes (< 500 sq. ft.).
      - Market rate rental housing.
      - "Family-suitable housing (i.e., 3 or more bedrooms and more than 1200 sq. ft.)."
      - "Market ownership housing (e.g. condos, townhouses)."
      - Luxury housing.
      - None of the above.
      - Decline to answer.
    option_limit: 8
  - label: HFL-02
    subject: housing
    question: >-
      Which of the following items do you support to minimize tenant
      displacement and maintain/grow the supply of affordable housing? Select
      up all that apply.
    type: multi
    graded: true
    owner: Homes for Living
    methodology: >-
      1 point per strategy to max of 8. To tackle tenant displacement local
      governments must take an all of the above approach to reduce the impacts
      associated with renovictions and evictions.
    options:
      - Award bonus density to affordable housing developments.
      - Redirect development pressure away from existing older multifamily by allowing new multifamily in more low-density areas.
      - Municipality-wide tenant assistance policies to allow existing tenants to maintain their current rent after their building is redeveloped.
      - Working with the province to create province-wide tenant assistance policies.
      - Identify and acquire new land for the development of non-market housing.
      - Temporarily exempt existing rental buildings from property taxes to fund building retrofits.
      - Exempt all below-market housing from any fees or levies charged by the municipality to developers.
      - Target a higher rental vacancy rate.
      - None of the above.
      - Decline to answer.
    option_limit: 8
  - label: HFL-03
    subject: housing
    question: >-
      Do you think your municipality should have target approval times for
      multifamily housing?
    type: single
    type_label: One answer
    graded: true
    owner: Homes for Living
    methodology: >-
      6 points for 30/180 days, prorated for longer timelines. Housing delayed
      is housing denied. Long delays drive us costs for housing, increase the
      chance that they will be cancelled, and indicate a lack of clear
      published guidelines. A time limit on decisions prioritizes housing
      action and reforms.
    options:
      - "Yes - Under 30 days for small projects under six units, 180 days for large projects over six units."
      - "Yes - Under 60 days for small projects under six units, 365 days for large projects over six units."
      - "Yes - Under 90 days for small projects under six units, 545 days for large projects over six units."
      - No.
      - Decline to answer.
  - label: HFL-04
    subject: housing
    question: >-
      If there was a type of housing you wanted to see more of (e.g.,
      affordable, non-market, family-sized, townhouses, etc.), what do you
      think are effective methods of getting more of it? Select all that
      apply.
    type: multi
    graded: true
    owner: Homes for Living
    methodology: >-
      1 point for each option, but -1 for choosing mandated requirements (d).
      To increase the building of certain desireable types of housing
      (affordable, family sized, etc), cities need to pursue a broad approach
      of both removing barriers and targetted incentives. Mandated
      requirements (or inclusionary zoning) have a track record of acting like
      a tax and therefore reducing housing construction or increasing costs.
    options:
      - Pre-zoning.
      - Bonus density.
      - Tax / DCC exemptions.
      - Mandated requirements.
      - Expedited reviews.
      - Remove zoning/procedural barriers.
      - Decline to answer.
      - "Other, please specify."
  - label: HFL-05
    subject: housing
    question: >-
      Do you believe that the municipality should pre-zone to the uses,
      heights and densities outlined in the Official Community Plan, so that
      OCP-compliant projects can be built without rezoning or public hearing?
    type: single
    type_label: One answer
    graded: true
    owner: Homes for Living
    methodology: >-
      3 points for yes, 0 for no. An OCP sets out the direction and vision for
      a municipality with broad input from the community and council. Matching
      zoning to long term consensus-based plans reduces scarcity and allows
      incentivizes OCP compliant housing to be built quickly.
    options:
      - "Yes"
      - "No"
      - Decline to answer.
  - label: HFL-06
    subject: housing
    question: >-
      Beyond the three to four units Bill 44 already requires, what is the
      most housing you think should be legal to build by-right (i.e. without
      rezoning) in traditional single-family areas of your municipality?
    type: single
    type_label: One answer
    graded: true
    owner: Homes for Living
    methodology: >-
      a) 0 points b) 1 points c) 2 points d) 5 points e) 6 points. With little
      room for new single family developments, housing abundance relies on
      density. People unable to afford a single family house should not be
      relegated to living only on busy arterials where high density is legal,
      but should have a diversity of housing options in every neighbourhood.
    options:
      - Nothing beyond the Provincial minimum.
      - Small Scale Multiunit Housing (up to 6 units).
      - Multi-lot townhouse developments (strata or freehold).
      - Small apartments (up to 3 floors).
      - Mid-rise apartments (up to 6 floors).
      - Decline to answer.
  - label: HFL-07
    subject: housing
    question: >-
      A housing proposal has been reviewed by staff and they recommend
      approval. It requires rezoning because the existing zoning has not been
      updated. If it faces substantial neighbourhood opposition, how would you
      generally vote?
    type: single
    type_label: One answer
    graded: true
    owner: Homes for Living
    methodology: >-
      3 points for a), 0 otherwise. Housing approval rules must be predictable
      and clear for those building housing, or it will lead to scarcity. If
      municipal planning staff have adequately considered objections to a
      project and still recommend approval it should be approved. If
      unanticipated issues are raised, policies should be clarified to ensure
      staff can work with applicants on future projects.
    options:
      - Support it if opposing comments have been considered by staff.
      - Support it only if it includes additional affordability or community benefits.
      - "Decide case by case, with neighbourhood opposition being an important consideration."
      - Generally oppose it if there is substantial neighbourhood opposition.
      - Decline to answer.
  - label: HFL-08
    subject: housing
    question: >-
      Do you support eliminating minimum parking requirements for new
      developments or suites?
    type: single
    type_label: One answer
    graded: true
    owner: Homes for Living
    methodology: >-
      1 point for yes, 2 points for yes with transportation demand management
      measures, 0 points for no. A single additional parking space can add
      tens of thousands to the cost of a home. However, a development without
      parking and without offsetting remedies can impact livability for the
      eventual occupants of a home.
    options:
      - Yes.
      - No.
      - "Yes, but only if alternatives are provided for residents, e.g., secured bike storage, car share, e-bike charging plugs, bus passes, etc."
      - Decline to answer.
  - label: HFL-09
    subject: housing
    question: >-
      Non-market housing often faces additional challenges getting approved.
      Which of the following measures do you support to improve the prospects
      for below-market housing construction? Select all that apply.
    type: multi
    graded: true
    owner: Homes for Living
    methodology: >-
      1 point for each option, but -1 for choosing mandated requirements (d).
      Building homes is hard, building non-market homes is substantially
      harder. This has serious socio-economic consequences for certain members
      of society. With the exception of mandated requirements (or inclusionary
      zoning), which have a track record of acting like a tax and therefore a
      deterrent to new construction, a broad and flexible approach is needed
      to help non-market housing across the approval finish line.
    options:
      - "Relaxing setbacks, form and character, or other zoning restrictions."
      - Offering bonus height or density.
      - Removing fees or levies charged by the municipality.
      - Mandating that affordable housing be built by developers (inclusionary zoning).
      - Donating municipal land.
      - Directly building or partnering with below-market developers to build affordable housing.
      - Upzoning for affordable housing (no rezoning required).
      - None of the above.
      - Decline to answer.
    option_limit: 7
  - label: HFL-10
    subject: housing
    question: >-
      If elected, what do you hope to have accomplished on the housing file at
      the end of your first year, and end of your four-year term?
    type: text
    type_label: "Written answer, up to 2,000 characters"
    graded: true
    owner: Homes for Living
    methodology: >-
      To receive full marks, candidates receive a point up to 7 for
      referencing impactful housing ideas in their answer including but not
      limited to: a rental vacancy rate target, a quantitative target
      regarding annual homes built, pre-zoning commitments / OCP alignment,
      non-profit by right commitment, commitment to tenant production aligned
      with platform, commitment to regulate and enforce Airbnb rules, delegate
      more rezoning / variance decisions to staff, a continuation of policies
      that have been working, developing a pre-approved catalog of housing
      designs, loosening design guidelines or other restrictive regulations,
      minimizing tenant displacement, increasing the regional housing fund,
      enhancing partnerships with other levels of government, the private
      sector, co-ops, and non-profit housing developers, streamlining
      regulations, and shorten requirements.
  - label: HFL-11
    subject: housing
    question: >-
      The BC government set a housing target for Victoria at 4,902 homes over
      five years, which represents 75% of the estimated housing need for that
      period. Regardless of provincial requirements or penalties, do you
      believe the city should strive to build:
    type: variant
    type_label: Asked separately for each municipality
    graded: true
    owner: Homes for Living
    methodology: >-
      6 points for too low, 1 for about right, 0 for too high. By definition,
      the provincial housing targets, being set as only 75% of estimated
      housing need is too low of a target to meet local housing needs.
    options:
      - Fewer homes than the target (the target is too high).
      - More homes than the target (the target is too low).
      - About that many homes (the target is approximately right).
      - Decline to answer.
  - label: HFL-12
    subject: housing
    question: >-
      Municipal asset-management plans have identified substantial gaps
      between current funding and the amount needed to maintain and replace
      roads, water and sewer systems, public buildings, and other
      infrastructure. In Victoria, the 2024 Corporate Asset Management
      Strategy identified $570 million worth of infrastructure in poor or very
      poor condition. Which approaches would you prioritize to address this
      infrastructure problem? Select up to two.
    type: "variant,multi"
    type_label: Asked separately for each municipality
    graded: true
    owner: Homes for Living
    methodology: >-
      5 points for selecting more housing and commercial development, 1 for
      seeking additional provincial or federal funding, 0 points for
      increasing taxes or reducing infrastructure projects, and -2 points for
      increasing development charges, amenity contributions, and other fees
      imposed on new houses.
    options:
      - Allow substantially more housing and commercial development to grow the tax base and help fund infrastructure renewal.
      - Increase property taxes or introduce a dedicated infrastructure levy.
      - "Increase development cost charges, amenity contributions, or other fees imposed on new housing and development."
      - "Reduce or defer infrastructure projects, service levels, or replacement standards."
      - Seek additional provincial or federal funding.
      - Decline to answer.
  # --- climate ---
  - label: CLI-01
    subject: climate
    question: >-
      Would you support ending fossil fuel advertising and sponsorship on
      property, media and events controlled by your municipality, to the
      extent the law allows? And would you advocate for the same at the
      Victoria Regional Transit Commission for BC Transit vehicles and
      shelters?
    type: pair
    type_label: Answer plus a written follow-up
    graded: true
    weight: "8.33%"
    owner: Climate Justice Victoria
    methodology: >-
      Two commitments in one question, so the menu answer alone cannot reach
      the top. The menu sets a base and a Yes on the follow-up about
      advocating at the Victoria Regional Transit Commission raises it one
      step. Yes, both advertising and sponsorship = B, and A with the
      follow-up. Yes, advertising only or Yes, sponsorship only = C, and B
      with the follow-up. No = F, because ending the advertising is something
      the municipality controls outright. A follow-up written as free text
      rather than ticked is a judgement about the candidate and is graded by
      hand. Decline to answer is F where nothing explains it, and the Grade is
      left blank where the candidate explained the decline in the topic's
      comment box or answered the rest of the topic solidly. Unsure is left
      blank. A blank Grade drops the row out of the category rollup entirely;
      N/A is reserved for a question that does not apply to a candidate and
      never means ungraded.
    options:
      - "Yes, both advertising and sponsorship."
      - "Yes, advertising only."
      - "Yes, sponsorship only."
      - "No"
      - Unsure
      - Decline to answer
      - "Yes"
      - "No"
      - Unsure
      - "Other, I have another idea."
      - Decline to answer.
  - label: CLI-02
    subject: climate
    question: >-
      The Capital Regional District declared a climate emergency in 2019. How
      should your municipality treat climate action in its next four-year
      plan?
    type: single
    type_label: One answer
    graded: true
    weight: "8.33%"
    owner: Climate Justice Victoria
    methodology: >-
      The overriding priority, other decisions should be tested against it =
      A. One of the top three priorities, with a dedicated budget = B. One
      priority among many, addressed where affordable = C-. Not a municipal
      priority = F. The ladder skips C on purpose: a dedicated budget is the
      line between a priority and a sentiment, so addressing climate only
      where affordable drops two steps rather than one. Handing the file to
      another order of government is F. Decline to answer is F where nothing
      explains it, and the Grade is left blank where the candidate explained
      the decline in the topic's comment box or answered the rest of the topic
      solidly. Unsure is left blank. A blank Grade drops the row out of the
      category rollup entirely; N/A is reserved for a question that does not
      apply to a candidate and never means ungraded.
    options:
      - "The overriding priority, other decisions should be tested against it."
      - "One of the top three priorities, with a dedicated budget."
      - "One priority among many, addressed where affordable."
      - "Not a municipal priority, it's a federal and/or provincial responsibility."
      - Decline to answer.
  - label: CLI-03
    subject: climate
    question: >-
      Will you pledge to never take meetings from fossil fuel company
      lobbyists?
    type: single
    type_label: One answer
    graded: true
    weight: "8.33%"
    owner: Common Horizon Victoria
    methodology: >-
      Yes = A, No = C-. The No is C- rather than F because of the split the
      grading settled on: a plain No is C- where the question is about
      governance or conduct and F where it is about infrastructure, land use
      or funding. This one asks a candidate to give up a channel of access to
      themselves, which is conduct. Decline to answer is F where nothing
