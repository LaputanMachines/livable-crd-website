  # --- transit ---
  - label: TRN-01
    subject: transit
    question: >-
      Which fare measures would you actively advocate for at the VRTC? Select
      all that apply.
    type: multi
    graded: true
    weight: "20%"
    owner: Better Transit YYJ
    methodology: >-
      A count of ticks, because no option here is cheaper than the others in
      the way CLI-06's are. Four or more = A. Three = B. Two = C. One = C-.
      None = F. The rows graded before this rubric was written are not
      perfectly consistent with it at three and two ticks; they were left as
      typed and the majority letter was taken. Decline to answer is F where
      nothing explains it, and the Grade is left blank where the candidate
      explained the decline in the topic's comment box or answered the rest of
      the topic solidly. Unsure is left blank. A blank Grade drops the row out
      of the category rollup entirely; N/A is reserved for a question that
      does not apply to a candidate and never means ungraded.
    options:
      - Free transit for everyone under 19 years of age.
      - "Free or half-priced fares for seniors, 65+ years of age."
      - Free or half-priced transit for people receiving income or disability assistance.
      - Lower-cost regional monthly pass.
      - None of the above.
      - Decline to answer.
    option_limit: 4
  - label: TRN-02
    subject: transit
    question: >-
      Do you support removing general on-street parking (excluding accessible
      parking spaces) from frequent transit corridors and main arterial
      streets in your municipality, and reallocating that space to bus lanes,
      loading zones, and walking and cycling infrastructure?
    type: single
    type_label: One answer
    graded: true
    weight: "30%"
    owner: Better Transit YYJ
    methodology: >-
      Yes, across the whole corridor = A. Yes, only during peak hours = B.
      Kind of, only when a specific project requires it = C. No = F. Peak
      hours only is a real, testable limit on a yes, so it takes the
      conditional-yes B. Only when a specific project requires it names no
      project and commits to nothing in advance, which is the case-by-case
      answer CLI-08 puts at C. A No is F because the question is about street
      space, which is infrastructure. Eight of the earlier rows put the
      case-by-case option at B and nineteen put it at C; the nineteen were
      followed. Decline to answer is F where nothing explains it, and the
      Grade is left blank where the candidate explained the decline in the
      topic's comment box or answered the rest of the topic solidly. Unsure is
      left blank. A blank Grade drops the row out of the category rollup
      entirely; N/A is reserved for a question that does not apply to a
      candidate and never means ungraded.
    options:
      - "Yes, across the whole corridor."
      - "Yes, only during peak hours."
      - "Kind of, only when a specific project requires it."
      - Decline to answer.
      - "No, never."
      - N/A
  - label: TRN-03
    subject: transit
    question: >-
      Do you support rapid deployment of transit priority measures on frequent
      transit corridors, even where this requires removing on-street parking
      or a general-purpose traffic lane?
    type: single
    type_label: One answer
    graded: true
    weight: "30%"
    owner: Better Transit YYJ
    methodology: >-
      Yes = A. Yes, but not at the cost of a general-purpose travel lane = C-.
      No = F. The question asks specifically about giving up a traffic lane,
      so a yes that rules the lane out withholds the one thing being asked for
      and cannot take the conditional-yes B. C- rather than F because the rest
      of the toolkit is still on the table. Decline to answer is F where
      nothing explains it, and the Grade is left blank where the candidate
      explained the decline in the topic's comment box or answered the rest of
      the topic solidly. Unsure is left blank. A blank Grade drops the row out
      of the category rollup entirely; N/A is reserved for a question that
      does not apply to a candidate and never means ungraded.
    options:
      - "Yes"
      - "No"
      - Unsure
      - N/A
      - "Yes, but not at the cost of a general-purpose travel lane."
      - Decline to answer.
  - label: TRN-04
    subject: transit
    question: Do you support the creation of a regional transportation authority?
    type: single
    type_label: One answer
    graded: true
    weight: "10%"
    owner: Better Transit YYJ
    methodology: >-
      Yes = A, No = C-. A No is C- rather than F because this asks who should
      decide, not what should be built or funded, which puts it on the
      governance side of the CLI-03 split. Three earlier rows typed F and two
      typed C-; the governance rule was followed over the count. Decline to
      answer is F where nothing explains it, and the Grade is left blank where
      the candidate explained the decline in the topic's comment box or
      answered the rest of the topic solidly. Unsure is left blank. A blank
      Grade drops the row out of the category rollup entirely; N/A is reserved
      for a question that does not apply to a candidate and never means
      ungraded.
    options:
      - "Yes"
      - "No"
      - Decline to answer
  - label: TRN-05
    subject: transit
    question: >-
      Do you support building new bus-only and bike-only connections through
      parks, golf courses or public land when doing so would substantially
      shorten transit and cycling trips?
    type: single
    type_label: One answer
    graded: true
    weight: "10%"
    owner: Better Transit YYJ
    methodology: >-
      Yes = A. Yes, if no mature trees are lost during construction = B. No =
      F. Losing no mature trees is a named and checkable condition, so it
      takes the conditional-yes B. A No is F because the question is about
      building a connection, which is infrastructure. Decline to answer is F
      where nothing explains it, and the Grade is left blank where the
      candidate explained the decline in the topic's comment box or answered
      the rest of the topic solidly. Unsure is left blank. A blank Grade drops
      the row out of the category rollup entirely; N/A is reserved for a
      question that does not apply to a candidate and never means ungraded.
    options:
      - "Yes"
      - "No"
      - Unsure
      - "Yes, if no mature trees are lost during construction."
      - Decline to answer.
