  - label: GOV-02
    subject: governance
    question: >-
      Do you support creating a regional service that designs, builds and
      maintains local municipal infrastructure shared across Capital Region
      municipalities?
    type: single
    type_label: One answer
    graded: true
    weight: "17%"
    owner: Better Transit YYJ
    methodology: >-
      Yes = A. Yes, only if full cost recovery is guaranteed for my
      municipality = B. No = C-. Full cost recovery is a named, checkable
      condition on a yes, so it takes the conditional-yes B. A No is C- rather
      than F because the question is about how services are organised and who
      runs them, which is the governance side of the split CLI-03 sits on the
      other side of. Unsure was typed C on three rows before 2026-09-13 and
      those rows were reset to blank on 2026-09-20, so the question now
      follows the shared policy. Decline to answer is F where nothing explains
      it, and the Grade is left blank where the candidate explained the
      decline in the topic's comment box or answered the rest of the topic
      solidly. Unsure is left blank. A blank Grade drops the row out of the
      category rollup entirely; N/A is reserved for a question that does not
      apply to a candidate and never means ungraded.
    options:
      - "Yes"
      - "No"
      - Unsure
      - "Yes, only if full cost recovery is guaranteed for my municipality."
      - Decline to answer
  - label: GOV-03
    subject: governance
    question: >-
      If elected, what three steps would you take to put your region or
      municipality on a firmer financial footing?
    type: text
    type_label: "Written answer, up to 1,000 characters"
    graded: true
    weight: "17%"
    owner: Strong Towns Victoria
    methodology: >-
      “Real financial resilience comes from increasing the productivity of
      land that's already served by infrastructure: letting neighborhoods
      incrementally thicken, encouraging redevelopment where roads and pipes
      already exist, building more value per acre instead of more acres that
      need public maintenance.” The Strong Towns approach thinks about revenue
      vs liabilities and the cost of replacing infrastructure as a key driver
      of municipal financial success. Next-increment intensification or better
      allows improved use of pipes, roads, and wires, increasing the economic
      base for the city while lowering vacancies (examples,
      https://www.strongtowns.org/journal/2026-8-5-the-biggest-misconception-in-municipal-finance,
      https://archive.strongtowns.org/journal/2015/5/10/lafayette). No credit
      was given for/against for either a) sharing costs with neighbouring
      governments or b) asking for money from higher levels of government,
      both of which may have additional merit beyond the boundaries of the
      muncipality. A-level (excellent) answer: 1. a comment about density
      being linked to financial wellbeing (revenue side), 2. a comment about
      efficient use of that revenue (expenses side), 3. thinking about
      infrastructure liabilities and how to pay for them given the
      intergenerational problems. B-level (good) answer considers some of
      these principles, but likely doesn't consider both revenue and expenses.
      C-level (mixed) - may have other ideas about arbitrary efficiencies and
      doesn't provide a mechanism for doing the work they propose (e.g. "fill
      up the reserve fund" -- with what money?). F - working in the opposite
      direction of resilience (e.g. arbitrary property tax increase caps), or
      doesn't answer the question (e.g. "my municipality is on firm financial
      footing").
  - label: GOV-04
    subject: governance
    question: >-
      Do you commit to eliminating mandatory parking minimums for all land
      uses in your municipality by 2030?
    type: single
    type_label: One answer
    graded: true
    weight: "17%"
    owner: Strong Towns Victoria
    methodology: >-
      Yes = A, No/Decline = F. Parking minimums are pseudoscience that should
      be eliminated from city codes everywhere, and have been eliminated in
      Vancouver, Edmonton, Regina, Ottawa, and others across North America
      without any negative consequences
      (https://archive.strongtowns.org/journal/2021/11/22/announcing-a-new-and-improved-map-of-cities-that-have-removed-parking-minimums)
    options:
      - "Yes"
      - "No"
      - Decline to answer
