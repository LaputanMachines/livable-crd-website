  - label: GOV-01
    subject: governance
    question: >-
      Do you support expanding shared or regional delivery of municipal
      services in the Capital Region?
    type: pair
    type_label: Answer plus a written follow-up
    graded: true
    weight: "17%"
    owner: Strong Towns Victoria
