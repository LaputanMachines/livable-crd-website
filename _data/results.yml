# 2026 general local election results, by municipality.
#
# Hand-kept, not synced. Vote counts are copied from CivicInfo BC's results
# dashboard (each municipality's `source` below), which the municipalities'
# own election pages link to. Only vote counts and who was elected are stored;
# every percentage the site prints is worked out from them in
# _plugins/election_results.rb, so a figure here and a figure on the page can
# never disagree, and a correction is one number rather than three.
#
# status: "preliminary" until chief election officers declare official results
#   (by 4pm, October 21, 2026). The scorecard says "Preliminary results" while
#   it is set. Once each municipality's declaration is out, check its counts
#   against it and change this to "official".
#
# municipalities, keyed by slug from _data/municipalities.yml:
#   ballots    Total ballots cast. The denominator for councillors: a voter
#              marks up to as many councillors as there are seats, so a share of
#              all council votes undersells every candidate; a share of ballots
#              reads as "this share of voters backed them".
#   source     Where the counts came from.
#   mayor / councillor
#              Every candidate on that ballot, in the order the source lists
#              them (most votes first). `name` is spelled as in
#              _data/candidates.yml, which is what the plugin joins on; where
#              the ballot spells it differently the ballot's spelling is in a
#              comment. A candidate in candidates.yml with no entry here was not
#              on the ballot and shows no result.
#              votes      Votes received.
#              elected    true for a winner.
#              acclaimed  true for a candidate elected without a vote.
#
# Mayor percentages are a share of all votes cast for mayor, which is what the
# municipalities' own results pages print.

