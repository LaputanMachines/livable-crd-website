        unscored:
          - label: GEN-01
            answer: |-
              Parks and recreation.

              Due to a long history of contracting out services and relying on public private partnerships, the City of Langford has an extremely small parks and recreation department.

              This has resulted in plenty of Pay to Play scenarios. Lacking a city owned and operated recreational facility greatly hampers our ability to offer affordable recreational programming right in our city.

              Fortunately as a owner of Westshore Parks and Recreation (WSPR), we have built a plan to expand this society to provide greater public access, but to date, these facilities are largely located outside of Langford, and any expansion will not be built or active for years.
