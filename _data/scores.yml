              This is a great and challenging question, as it could be answered in any number of ways. Prior to this year, I might have answered "the Crystal Pool," which is the most important municipal asset that needs replacing in Victoria. Now that this project is underway, I would narrow in on the "feature" aspect of this question, and specifically unsheltered homelessness, street disorder, and community safety.

