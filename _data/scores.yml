              In a hypothetical scenario in which the City were given $10m in unrestricted funds, I would spend those funds thusly: $2m for housing, $1m for parks and rec, $750k for transit, $750k for arts and culture, $1.25m for rolling and cycling infrastructure, $1m for walking infrastructure, $1.5m for climate action, and $1.75m for unhoused resident services.

              I would not put the $10m into roads, policing, clinics, or emergency services, not because they aren't important services, but rather because they either 1) already possess stable funding streams, or 2) a few million dollars wouldn't move the needle enough to make it worthwhile, or 3) the funding they require is ongoing operational costing rather than one-time capital grants.

              The $2m for housing would go into the Housing Reserve Fund, which is used for co-investing in affordable housing projects. The $1m for walking and $1.25m for active transportation would go into specific capital projects meant to make it safer for people to get around Victoria. The $1m for parks and rec would go towards any number of stalled projects that are meant to improve the lives of Victoria families, and could include a splash park, new swimming features in the Gorge, sport courts, or even reducing some of the borrowing costs of the Crystal Pool. The $750k for arts and culture would go towards the acquisition of a decommodified arts and music space for local artists. The $1.5m for climate action would become part of a fund to offset the costs of deep retrofits in apartments that badly need heat pumps to decarbonize and create cooling systems for vulnerable tenants. The $1.75m for unhoused residents would go towards programs that help flow people up from shelters into housing, which I'd seek to pair with funding from the Province for the same. The $750k for transit would likely go towards infrastructure upgrades for transit priority.

              This is a great thought experiment because it reminds us that cities must always do more than one thing at a time, and that there's no easy answers when it comes to resource allocation and competing priorities.
