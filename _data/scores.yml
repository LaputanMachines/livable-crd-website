              Where to begin!

              In addition to being a Victoria City Councillor, I have also had the pleasure of serving as a CRD Director on the Transportation Committee and as a Victoria Regional Transit Commissioner, all of which places me at the centre of the rapidly shifting transportation reality that we find ourselves in.

              At a high level, the problem is that all aspects of transportation governance have been balkanized and siloed for many years. Even the fact that the CRD and the VRTC have their own transportation plans is, in my view, a problem. Too much of the authority is divided between local governments, the CRD, the VRTC, the Province, and even the Reconciliation Corridor Steering Committee and Island Corridor Foundation. It is a confused transportation situation at the moment.

              I support the fusing of authorities between the CRD (Transportation Committee) and the VRTC into a unified Transportation Commission. This process is in the early stages of development and advocacy has begun.
