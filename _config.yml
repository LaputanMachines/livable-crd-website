title: Livable CRD
description: >-
  A coalition scorecard for Capital Regional District municipal election
  candidates on transit, housing, arts, climate, and related livability topics.
url: "https://livablecrd.ca"
baseurl: ""
email: hello@livablecrd.ca
donate_url: "https://actionnetwork.org/fundraising/support-livable-crd/"

# Social media accounts. Rendered by _includes/social-links.html (in the footer
# on every page and at the bottom of each blog post). `platform` selects the
# icon in that include, so it must be one of: instagram, facebook, bluesky.
social:
  - platform: instagram
    label: Instagram
    url: "https://www.instagram.com/livablecrd/"
  - platform: facebook
    label: "Facebook group"
    url: "https://www.facebook.com/groups/2457957961344839"
  - platform: bluesky
    label: Bluesky
    url: "https://bsky.app/profile/livablecrd.bsky.social"

# Action Network mailing-list form slug. This is the form NAME as it appears in
# the Action Network embed code / hosted URL (the part after /form/ in the
# widget src). Set this to the slug of the form you created, e.g. if the embed
# src is .../widgets/v5/form/livable-crd-mailing-list?..., use that final token.
signup_form_slug: "livable-crd-mailing-list"

# --- Elections BC registration ---
# Rendered by _includes/sponsor-notice.html: the footer on every page, plus an
# inline callout on the About, Donate, and Press pages. Edit the wording here,
# not in the templates, so every instance stays consistent.
#
# `registration_number` is blank until Elections BC issues one; the include
# renders the number automatically as soon as it is set. Set `registered: false`
# to pull the notice off the entire site at once (e.g. between election cycles,
# when the registration lapses).
sponsor:
  registered: true
  term: "registered local elections advertising sponsor"
  authority: "Elections BC"
  registration_number: ""
  # Elections BC's own explainer for third-party sponsors, linked from the notice
  # so a reader can check what the registration actually obliges us to do instead
  # of taking our sentence for it. `guide_label` is the document's exact title as
  # printed on its cover; if Elections BC reissues it under a new name, change
  # both together. Blank `guide_url` to drop the sentence site-wide.
  guide_url: "https://elections.bc.ca/docs/lecfa/guide-for-local-elections-third-party-sponsors-in-bc.pdf"
  guide_label: "Guide for Local Elections Third Party Sponsors in B.C."

# Feature flags
# Render coalition partner logos on the homepage. Disabled for now; the logo
# files and `logo:` entries in _data/partners.yml are kept; flip to true to
# re-enable. (Changing this requires restarting `jekyll serve`.)
partner_logos: false

# The election every page on this site is about. Read by
# _plugins/candidate_pages.rb, which puts it in the <title> and description of
# each candidate page and each municipality index: people search for "esquimalt
# candidates 2026", and until this existed the year appeared nowhere a search
# engine reads it, only inside the dates in _data/deadlines.yml. Set it once at
# the start of a cycle. Blank it and every page drops the year cleanly rather
# than printing a stale one.
election_year: 2026

# General voting day, as an ISO date string. Read by
# _plugins/candidate_pages.rb for each municipality index's date line and
# meta description, and by the Liquid `date` filter wherever a template prints
# it, so the date is written here once and nowhere else.
#
# NOT in _data/deadlines.yml. That file is the coalition's own schedule - every
# entry in it is something this project does, the homepage renders it under
# "Project timeline", and it deliberately ends on the day the grades are
# published. General voting day is a fact about the election rather than a
# milestone of ours.
#
# Quoted so Jekyll hands templates a plain string, which is what the Liquid
# `date` filter wants; the plugin parses it into a Date itself. Blank it and
# every date line disappears cleanly rather than printing a stale one - which
# is the behaviour to rely on rather than guessing, because a wrong voting day
# is the worst fact this site could publish.
#
# Source: Elections BC - B.C. general local elections are held on the third
# Saturday of October every four years.
election_day: "2026-10-17"

# --- SEO (jekyll-seo-tag) ---
# The homepage <title>, set through `defaults:` below rather than as `tagline`.
#
# `tagline` renders the homepage as "Livable CRD | <tagline>", which leads with
# the brand; a page title leads with the words instead - "2026 Capital Region
# candidate scorecard | Livable CRD" - and the brand is the half a truncated
# title can afford to lose. It also fixes og:title: seo-tag takes that from the
# page title and falls back to the bare site title, so every share of the
# homepage read just "Livable CRD" while the <title> beside it said far more.
#
# Kept short so the full homepage <title> stays under Google's ~60-char limit
# (this one lands at 53). The year is written out here rather than read from
# `election_year` above: _config.yml is not itself templated.
locale: en_CA
logo: /assets/images/logo.png            # publisher logo in structured data

markdown: kramdown
permalink: pretty

# jekyll-seo-tag only reads `image` from page front matter (not site-wide), and
# auto-upgrades the Twitter card to summary_large_image when an image is present.
# Inject the default social image into every page so og:image/twitter:image emit.
# Individual pages can override `image` in their own front matter.
defaults:
  # The homepage title. See the SEO note above for why it is set here rather
  # than as `tagline`; it is scoped to the one file so no other page inherits it.
  - scope:
      path: "index.md"
    values:
      title: "2026 Capital Region candidate scorecard"
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/og-image.png
        width: 1200
        height: 630
        alt: "Livable CRD: Capital Region municipal election candidate scorecard"
  # Blog posts: dateless URLs under /blog/ and the shared post layout.
  # This per-collection permalink overrides the global `pretty` style above.
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/

# jekyll-feed RSS/Atom feed. Limit the feed to actual blog posts.
feed:
  path: /feed.xml

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .github
  - scripts
  # Internal coalition documents (meeting decks and the like). Excluded so they
  # are never copied into _site and served from livablecrd.ca.
  - documents

sass:
  style: compressed
